dataprocessor:
  type: odm
  seed: 42
  odm:
    update_interval: 10
    sampling_interval: 1
    reward_type: entropy
    gamma: 0.1
    eta: 0.3
datasets:
- name: tuning_data_inventory
  split:
    train: 0.9
    validation: 0.1
  data_paths:
  - /proj/granite-build/g4os/defense/defense_xmldata_v2/20260914T194134/inventory_10102025_training_v2/data/*.parquet
  data_handlers:
  - name: tokenize_and_apply_chat_template_with_masking
    arguments:
      remove_columns: all
      batched: false
      fn_kwargs:
        conversation_column: messages
