<% if KNOWLEDGE | string | lower in ("true", "yes", "1", "on") %>
<% for kname, kscript, kbatch, ktools, kds in [
  ("knowledge", "unitxt_benchmarks/defense_knowledge/defense_knowledge_unitxt_evaluation.py", 10, "", ""),
  ("knowledge_with_tools", "unitxt_benchmarks/defense_knowledge/defense_knowledge_unitxt_evaluation_with_tool_calls.py", 6, "router_15092025_tools_v2", "knowledge_validation_set,knowledge_test_set"),
] %>
    $${kname}:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        model:
          binding: merge.merged_model
      outputs:
        eval_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/defense-eval-slurm
          config:
            code_config:
              ref: "$${FM_EVAL_REF}"
            data_path: "$${DATA_PATH}"
            knowledge_data_path: "$${KNOWLEDGE_DATA_PATH}"
            credentials_file: "$${WATSONX_CREDENTIALS_FILE}"
            output_root: "$${OUTPUT_ROOT}/$${NAME}"
            name: "$${kname}"
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            eval_config:
              script: "$${kscript}"
              dataset_names: "$${kds}"
              tools: "$${ktools}"
              batch_size: $${kbatch}
              vllm_tp_size: $${NUM_GPUS_PER_NODE}
              # Vela custom_knowledge* k8s.env
              extra_env:
                WML_READ_TIMEOUT: "900"
                WML_TIMEOUT_RETRIES: "6"
                # No `if __name__ == "__main__"` guard in these scripts, so spawn
                # (the step default) re-runs them in vLLM's worker and aborts.
                VLLM_WORKER_MULTIPROC_METHOD: fork
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${NUM_GPUS_PER_NODE}
              num_cpus_per_node: $${GPU_CPUS}
            launcher_config:
              sbatch_options:
                exclude: "$${EXCLUDE_NODES}"
                time: "$${TIME_LIMIT}"
<% if QOS | string | trim != "" %>
                qos: "$${QOS}"
<% endif %>
              resources:
                accelerators: "$${ACCELERATORS}"
                memory: $${MEMORY}
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"
<% endfor %>
<% endif %>
