######
# eval-defense (SLURM) — merge a LoRA adapter, then run the defense tool-calling evals with
# vLLM on BlueVela, the same way Vela's defence/granite_dot_build_enhanced/eval_g42nt_local.yaml
# did (one target per category, fm-eval@unitxt_benchmarks_local, vLLM TP=2 on 2 GPUs,
# SYSTEM_PROMPT=none TEMPERATURE=0 TOP_P=1.0, same DATASET_NAMES/TOOLS/BATCH_SIZE per category).
#
#   merge  (lora-merge-slurm)  ->  12 x <category>  (defense-eval-slurm, in parallel)
#
# Differences from Vela (see the defense-eval-slurm step README):
#   * Scores go to $${OUTPUT_ROOT}/$${NAME}/<category>/result.jsonl (+ instance_scores.jsonl,
#     eval.log) instead of the Lakehouse.
#   * The 2 knowledge targets (knowledge, knowledge_with_tools; KNOWLEDGE=true) read the
#     Lakehouse tables from parquet pulled to $${KNOWLEDGE_DATA_PATH}, and get the watsonx
#     judge credentials from $${WATSONX_CREDENTIALS_FILE} (NAME: <base64> lines).
#
# Run (parameters.yaml beside this file is picked up automatically):
#   gb build start -f recipes/granite4-defense-lora/slurm/eval-defense/build.yaml --skip-version-check
# Another checkpoint:
#   --param ADAPTER_PATH=/proj/.../checkpoint-3000 --param NAME=eval_g42nt_lora_3b_cd2bfbc2_3000
######
granite.build:
  name: $${NAME}
  retries:
    max_retries: $${MAX_RETRIES}
    target_reuse_enabled: true
  targets:
    merge:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        base_model:
          uri: "env://$${BASE_MODEL_PATH}"
          type: model
        adapter:
          uri: "env://$${ADAPTER_PATH}"
          type: model
      outputs:
        merged_model:
          uri: "env://{{ binding.path }}"
          type: model
      steps:
        - step_uri: space://steps/lora-merge-slurm
          config:
            output_dir: "$${MERGED_PATH}"
            force: $${FORCE_MERGE}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: 1
              num_cpus_per_node: 16
            launcher_config:
              sbatch_options:
                exclude: "$${EXCLUDE_NODES}"
                time: "1:00:00"
<% if QOS | string | trim != "" %>
                qos: "$${QOS}"
<% endif %>
              resources:
                accelerators: "H200:1"
                memory: $${MERGE_MEMORY}
                cluster: "$${CLUSTER}"
                zone: "$${QUEUE}"

    inventory:
      environment_uri: "$${ENVIRONMENT_URI}"
      inputs:
        model:
          binding: merge.merged_model
      outputs:
        eval_results:
          uri: "env://{{ binding.path }}"
          type: dataset
      steps:
        - step_uri: space://steps/defense-eval-slurm
          config:
            code_config:
              ref: "$${FM_EVAL_REF}"
            data_path: "$${DATA_PATH}"
            output_root: "$${OUTPUT_ROOT}/$${NAME}"
            name: "inventory"
            poll_interval_seconds: $${POLL_INTERVAL_SECONDS}
            log_retrieval_interval_seconds: $${LOG_RETRIEVAL_INTERVAL_SECONDS}
            eval_config:
              script: "unitxt_benchmarks/defense/defense_unitxt_evaluation_with_profile.py"
              dataset_names: "inventory_04092025_trainingforeval_v1,inventory_01092025_test_v1"
              tools: "janes_tool_calling_v6"
              batch_size: 10
              vllm_tp_size: $${NUM_GPUS_PER_NODE}
            compute_config:
              num_nodes: 1
              num_gpus_per_node: $${NUM_GPUS_PER_NODE}
              num_cpus_per_node: $${GPU_CPUS}
            launcher_config:
              sbatch_options:
                exclude: "$${EXCLUDE_NODES}"
                time: "$${TIME_LIMIT}"
<% if QOS | string | trim != "" %>
                qos: "$${QOS}"
